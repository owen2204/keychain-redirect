<!DOCTYPE html>
<html>
<head>
    <title>กำลังโหลด... กรุณารอสักครู่</title>
    <!-- **สำคัญ:** เปลี่ยนลิงก์ข้างล่างนี้เป็นลิงก์ Debug ของ CodePen ของคุณจริงๆ -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #555;
            background-color: #fefefe;
            text-align: center;
            margin: 0;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff4d8d;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div>
        <div class="spinner"></div>
        <p>กำลังเตรียมความทรงจำ...<br>หากรอนานเกินไป กรุณา <a href="https://cdpn.io/pen/debug/xbgQQmw?authentication_hash=XBAGRmGoGLer">คลิกที่นี่</a></p>
    </div>
</body>
